services:
  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    image: carapp
    volumes: 
      - ../logs:/app/logs
    ports:
      - "8080:8080"
    env_file: ".env"
    depends_on:
      - postgres
    
  postgres:
    image: postgres:14-alpine
    restart: always
    env_file: ".env"
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
  